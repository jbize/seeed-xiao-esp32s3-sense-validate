; Two sketches for the Seeed Studio XIAO ESP32S3 Sense.
; Arduino-ESP32 2.0.17 (espressif32 6.13.0) is the same generation as the
; boards already measured, so FRAMESIZE_XGA is 1024x768.
; The default environment is the picture test. The radio performance
; environment never builds the camera sketch.

[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:seeed_xiao_esp32s3]
build_src_filter = +<*> -<radio_performance.cpp>
build_flags =
    -DBOARD_HAS_PSRAM

[env:radio_performance]
build_src_filter = +<radio_performance.cpp>
